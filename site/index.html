<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gotham FC's Move to Queens: Does Transit Access Fill Seats?</title>
    <meta
      name="description"
      content="Gotham FC leaves New Jersey for Queens in 2028, trading two million New Jerseyans for seven million New Yorkers. A geospatial study of whether transit accessibility actually fills seats."
    />
    <meta name="author" content="Isabel Prado-Tucker" />

    <!-- Preconnect for the Google Fonts imported at the top of src/index.css: the stylesheet is
         only discovered after the CSS loads, so warming both origins early saves a round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Link previews, for sharing this as portfolio work. -->
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Gotham FC's Move to Queens" />
    <meta
      property="og:description"
      content="Three million people will be able to reach a home game within an hour. Two million others will find it harder. Does transit accessibility translate to attendance?"
    />
    <meta property="og:url" content="https://gotham-at-etihad.vercel.app/" />
    <!-- Social card: same title-card treatment as the Hero, rendered at 1200x630 so it fills the
         large Twitter/OG preview instead of getting cropped. Regenerate by re-rendering
         site/src/sections/Hero.tsx's markup at that canvas size if the headline or hero image
         ever changes -- see git history for the exact recipe used. -->
    <meta property="og:image" content="https://gotham-at-etihad.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gotham FC's Move to Queens" />
    <meta
      name="twitter:description"
      content="Three million people will be able to reach a home game within an hour. Two million others will find it harder."
    />
    <meta name="twitter:image" content="https://gotham-at-etihad.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
